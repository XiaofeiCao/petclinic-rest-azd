  <text x="575" y="240" font-size="14">JDBC + identity A + TLS</text>
  <path d="M390 620 V585 H245 V501 C235 501 235 485 245 485 V375 H260" class="runtime"/>
  <text x="260" y="606" font-size="13">Private image pull</text>
  <path d="M540 380 H805 V590 H710 V620" class="runtime"/>
  <text x="721" y="580" font-size="13">Logs</text>

  <path d="M185 493 H260" class="transient"/>
  <path d="M560 489 H905 V520 H930" class="transient"/>
  <text x="590" y="478" font-size="13" class="temporary">Same identity B registered as admin</text>
  <path d="M1070 470 V435" class="transient"/>
  <path d="M410 516 V560 H880 V411 H930" class="transient"/>
  <text x="585" y="549" font-size="13" class="temporary">Job executes bootstrap SQL over TLS</text>

  <text x="930" y="623" font-size="14" class="heading temporary">Extension-owned temporary lifecycle</text>
  <text x="930" y="651" font-size="13">Create job B; register B as admin</text>
  <text x="930" y="676" font-size="13">Reconcile; revoke admin; delete job</text>
  <text x="930" y="701" font-size="13">Persistent infrastructure stays in Bicep</text>

  <path d="M40 777 H70" fill="none" stroke="#2673b8" stroke-width="3"/>
  <text x="82" y="782" font-size="14">Persistent runtime</text>
  <path d="M270 777 H300" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="312" y="782" font-size="14">Temporary bootstrap</text>
  <text x="40" y="818" font-size="15" class="heading">Validated: deploy, redeploy + restart, reprovision, REST CRUD and persistent data.</text>
  <text x="40" y="850" font-size="13">Development build | Payload d0dd45c | Asynchronous test cleanup accepted; deletion completion not polled.</text>
</svg>
