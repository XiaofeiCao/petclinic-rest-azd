<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"
  role="img" aria-labelledby="title description">
  <title id="title">Passwordless Spring Petclinic with two distinct system-assigned identities</title>
  <desc id="description">
    Public HTTPS clients reach Petclinic REST in Azure Container Apps. The application's system identity A
    pulls the private image and authenticates to PostgreSQL as the non-admin petclinic_app role.
    A separate temporary bootstrap job has system identity B. PostgreSQL temporarily registers that same
    principal B as an Entra administrator. The extension reconciles SQL over verified TLS, removes the
    administrator registration, and deletes the job. The trial's environment is VNet-integrated; PostgreSQL
    remains publicly addressed with exact Container Apps egress-IP firewall rules. The development E2E
    verified initial deployment, redeployment and restart, reprovisioning, REST persistence and cleanup
    initiation. The asynchronous test-environment deletion was accepted; completion was not polled.
  </desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2673b8"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b7791f"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #42556e; }
      .heading { font-weight: bold; fill: #183153; }
      .temporary { fill: #8a5a13; }
      .runtime { fill: none; stroke: #2673b8; stroke-width: 3; marker-end: url(#blue); }
      .transient { fill: none; stroke: #b7791f; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#amber); }
    </style>
  </defs>
