<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"
  role="img" aria-labelledby="title description">
  <title id="title">Passwordless Spring Petclinic with local provision-only PostgreSQL bootstrap</title>
  <desc id="description">
    Public HTTPS clients reach Petclinic REST in Azure Container Apps. The application's system identity A
    pulls the private image and authenticates to PostgreSQL as the non-admin petclinic_app role.
    During postprovision the local extension opens an owned temporary all-IPv4 firewall rule and
    reconciles SQL over verified TLS as the signed-in User. It preserves the selected administrator
    and uses an existing caller registration or creates and removes a temporary caller registration.
    Cleanup must finish before provisioning is ready. Runtime access uses exact Container Apps
    egress-IP firewall rules. There is no deployed bootstrap Job or runner image, and deploy does not
    repeat administrator SQL.
  </desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2673b8"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b7791f"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #42556e; }
      .heading { font-weight: bold; fill: #183153; }
      .temporary { fill: #8a5a13; }
      .runtime { fill: none; stroke: #2673b8; stroke-width: 3; marker-end: url(#blue); }
      .transient { fill: none; stroke: #b7791f; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#amber); }
    </style>
  </defs>
  <rect width="1280" height="880" fill="#f7f9fc"/>
  <text x="40" y="52" font-size="30" class="heading">Spring Petclinic REST on Azure</text>
  <text x="40" y="84" font-size="17">azd + azure.springboot | System-assigned identity | Passwordless PostgreSQL</text>

  <rect x="210" y="120" width="1030" height="620" rx="18" fill="#fff" stroke="#9eb5cf" stroke-width="2"/>
  <text x="235" y="151" font-size="18" class="heading">Azure resource group</text>
  <rect x="235" y="174" width="600" height="360" rx="12" fill="#eef6ff" stroke="#8ab6e2" stroke-width="2"/>
  <text x="260" y="205" font-size="18" class="heading">Azure Container Apps environment</text>
  <text x="260" y="229" font-size="13">Application system identity / public HTTPS ingress</text>

  <rect x="20" y="280" width="165" height="85" rx="12" fill="#fff" stroke="#9eb5cf" stroke-width="2"/>
  <text x="102" y="313" text-anchor="middle" font-size="18" class="heading">API clients</text>
  <text x="102" y="341" text-anchor="middle" font-size="14">Public / no auth</text>
  <rect x="260" y="275" width="280" height="125" rx="12" fill="#fff" stroke="#2673b8" stroke-width="2"/>
  <text x="400" y="307" text-anchor="middle" font-size="20" class="heading">Petclinic REST</text>
  <text x="400" y="335" text-anchor="middle" font-size="16">Spring Boot / Container App</text>
  <text x="400" y="365" text-anchor="middle" font-size="16" class="heading">App system identity A</text>
  <text x="400" y="387" text-anchor="middle" font-size="12">Identity belongs to this app</text>
  <text x="575" y="310" font-size="16" class="heading">App-owned startup</text>
  <text x="575" y="339" font-size="14">Original schema + seed SQL</text>
  <text x="575" y="367" font-size="13">App owns tables; non-admin</text>

  <rect x="260" y="440" width="300" height="76" rx="12" fill="#fff8e8" stroke="#b7791f"
    stroke-width="2" stroke-dasharray="8 6"/>
  <text x="410" y="469" text-anchor="middle" font-size="18" class="heading">Application runtime only</text>
  <text x="410" y="498" text-anchor="middle" font-size="15">No bootstrap Job or runner</text>
  <rect x="20" y="453" width="165" height="105" rx="12" fill="#fff" stroke="#b7791f" stroke-width="2"/>
  <text x="102" y="485" text-anchor="middle" font-size="16" class="heading">Local extension</text>
  <text x="102" y="511" text-anchor="middle" font-size="14">Postprovision SQL</text>
  <text x="102" y="535" text-anchor="middle" font-size="14">Signed-in User</text>

  <rect x="930" y="260" width="280" height="175" rx="12" fill="#eaf7ed" stroke="#568960" stroke-width="2"/>
  <text x="1070" y="294" text-anchor="middle" font-size="20" class="heading">PostgreSQL 16</text>
  <text x="1070" y="321" text-anchor="middle" font-size="15">Azure Flexible Server</text>
  <text x="1070" y="347" text-anchor="middle" font-size="14">petclinic_app maps to identity A</text>
  <text x="1070" y="373" text-anchor="middle" font-size="14">Entra-only / password auth disabled</text>
  <text x="1070" y="398" text-anchor="middle" font-size="14">Public endpoint / exact ACA IP rules</text>
  <text x="1070" y="421" text-anchor="middle" font-size="14">TLS verify-full / non-admin app</text>

  <rect x="930" y="470" width="280" height="105" rx="12" fill="#fff8e8" stroke="#b7791f"
    stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1070" y="500" text-anchor="middle" font-size="16" class="heading temporary">Caller Entra registration</text>
  <text x="1070" y="528" text-anchor="middle" font-size="14">Existing or temporarily owned</text>
  <text x="1070" y="553" text-anchor="middle" font-size="13">Selected administrator is preserved</text>

  <rect x="260" y="620" width="260" height="85" rx="12" fill="#fff" stroke="#2673b8" stroke-width="2"/>
  <text x="390" y="652" text-anchor="middle" font-size="18" class="heading">Container Registry</text>
  <text x="390" y="681" text-anchor="middle" font-size="14">AcrPull granted to app identity A</text>
  <rect x="585" y="620" width="250" height="85" rx="12" fill="#fff" stroke="#2673b8" stroke-width="2"/>
  <text x="710" y="652" text-anchor="middle" font-size="18" class="heading">Log Analytics</text>
  <text x="710" y="681" text-anchor="middle" font-size="14">Application + platform logs</text>

  <path d="M185 322 H260" class="runtime"/>
  <text x="193" y="305" font-size="13">HTTPS</text>
  <path d="M540 288 H555 V250 H900 V290 H930" class="runtime"/>
  <text x="575" y="240" font-size="14">JDBC + identity A + TLS</text>
  <path d="M390 620 V585 H245 V501 C235 501 235 485 245 485 V375 H260" class="runtime"/>
  <text x="260" y="606" font-size="13">Private image pull</text>
  <path d="M540 380 H805 V590 H710 V620" class="runtime"/>
  <text x="721" y="580" font-size="13">Logs</text>

  <path d="M185 535 H205 V585 H905 V520 H930" class="transient"/>
  <text x="590" y="478" font-size="13" class="temporary">Optional temporary caller registration</text>
  <path d="M1070 470 V435" class="transient"/>
  <path d="M185 493 H220 V560 H880 V411 H930" class="transient"/>
  <text x="585" y="549" font-size="13" class="temporary">Local SQL / temporary all-IPv4 rule / TLS</text>

  <text x="930" y="623" font-size="14" class="heading temporary">Extension-owned temporary lifecycle</text>
  <text x="930" y="651" font-size="13">Record ownership; open bootstrap access</text>
  <text x="930" y="676" font-size="13">Local SQL; remove owned rule and grant</text>
  <text x="930" y="701" font-size="13">Persistent infrastructure stays in Bicep</text>

  <path d="M40 777 H70" fill="none" stroke="#2673b8" stroke-width="3"/>
  <text x="82" y="782" font-size="14">Persistent runtime</text>
  <path d="M270 777 H300" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="312" y="782" font-size="14">Temporary bootstrap</text>
  <text x="40" y="818" font-size="15" class="heading">Provision-only setup; deploy does not repeat administrator SQL.</text>
  <text x="40" y="850" font-size="13">Temporary access has no automatic expiry. Failed cleanup blocks readiness; retain local recovery state.</text>
</svg>
