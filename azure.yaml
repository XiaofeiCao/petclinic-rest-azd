name: petclinic-rest

requiredVersions:
  azd: ">=1.37.2"
  extensions:
    azure.springboot: ">=0.1.0"

infra:
  provider: bicep
  path: infra
  module: main

services:
  spring-petclinic-rest-app:
    project: .
    language: java
    host: springbootapp
    module: application
    # Existing Dockerfile: build the application inside Docker.
    # Alternatively, projects without an authored Dockerfile can omit this block
    # to use local Maven and an extension-generated runtime Dockerfile.
    docker:
      path: Dockerfile
      context: .
      platform: linux/amd64
    database:
      type: postgresql
      serverResourceId: ${DATABASE_SERVER_ID}
      databaseName: petclinic
      auth:
        type: managedidentity
        username: petclinic_app
        appIdentity:
          type: userAssigned
          resourceId: ${APPLICATION_IDENTITY_ID}
