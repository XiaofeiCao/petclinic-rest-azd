name: Validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AZD_CONFIG_DIR: ${{ runner.temp }}/petclinic-azd-config
      DOCKER_CONFIG: ${{ runner.temp }}/petclinic-docker-config
      AZURE_DEV_COLLECT_TELEMETRY: 'no'
      AZD_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Compile infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/petclinic-main.json
          az bicep build --file infra/application.bicep --outfile /tmp/petclinic-application.json
      - name: Validate managed identity template
        shell: pwsh
        run: ./tests/Test-ManagedIdentityProfile.ps1
      - name: Check out the packaging-only prototype extension
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: XiaofeiCao/azure-dev
          ref: 6acee73a75cca98c3fddaca49445f4dad71298c5
          path: .extension-src
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: .extension-src/cli/azd/extensions/azure.springboot/go.sum
      - name: Set up azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: '1.37.2'
      - name: Build and install the prototype extension
        working-directory: .extension-src/cli/azd/extensions/azure.springboot
        run: |
          azd extension install microsoft.azd.extensions --version 0.14.0 --no-prompt
          azd x build --skip-install
          azd x pack --bundle --output "$RUNNER_TEMP/azure.springboot_0.1.0.zip"
          azd extension install "$RUNNER_TEMP/azure.springboot_0.1.0.zip" --no-prompt
      - name: Validate database and packaged application
        shell: pwsh
        run: |
          azd init -e local-check --no-prompt
          if ($LASTEXITCODE -ne 0) { throw 'Local environment initialization failed.' }
          $packageJson = azd package --no-prompt --output json
          if ($LASTEXITCODE -ne 0) { throw 'Application packaging failed.' }
          $package = ($packageJson -join "`n") | ConvertFrom-Json
          $images = @($package.services.'spring-petclinic-rest-app'.artifacts |
              Where-Object { $_.kind -eq 'container' -and $_.locationKind -eq 'local' })
          if ($images.Count -ne 1 -or [string]::IsNullOrWhiteSpace($images[0].location)) {
              throw 'Expected exactly one packaged local application image.'
          }
          pwsh -File tests/Test-ApplicationDatabase.ps1 -ApplicationImage $images[0].location
          if ($LASTEXITCODE -ne 0) { throw 'Local database validation failed.' }
          pwsh -File tests/Test-ManagedIdentityProfile.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Post-package template validation failed.' }
